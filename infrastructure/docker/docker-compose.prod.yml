# SILEX ERP — Production Compose Configuration (Hardened for VPS)
# Seul Caddy écoute publiquement sur 80 (HTTP) et 443 (HTTPS)
# PostgreSQL, l'API et le Frontend sont isolés dans le réseau privé silex-net.

services:
  postgres:
    image: postgres:16-alpine
    container_name: silex_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Africa/Algiers
    # Aucun port exposé sur l'hôte en production
    volumes:
      - silex_pgdata:/var/lib/postgresql/data
    networks:
      - silex-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: silex_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DEMO_MODE: "false"
      TZ: Africa/Algiers
    # Aucun port hôte exposé - joignable uniquement via le reverse proxy Caddy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - silex-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/projects/kpis || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: silex_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      DEMO_MODE: "false"
      TZ: Africa/Algiers
    # Aucun port hôte exposé - joignable uniquement via le reverse proxy Caddy
    depends_on:
      - api
    networks:
      - silex-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: silex_caddy
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - silex_caddy_data:/data
      - silex_caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - silex-net

volumes:
  silex_pgdata:
    name: silex_pgdata
  silex_caddy_data:
    name: silex_caddy_data
  silex_caddy_config:
    name: silex_caddy_config

networks:
  silex-net:
    name: silex-net
    driver: bridge
